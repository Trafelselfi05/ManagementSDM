<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>Task - Wordpress plugin update</title>
    <link rel="stylesheet" href="globals.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      /** @type {import('tailwindcss').Config} */
      tailwind.config = {
        theme: {
          extend: {},
        },
        plugins: [],
      };
    </script>
  </head>
  <body>
    <main class="bg-transparent grid justify-items-center [align-items:start] w-screen">
      <article
        class="bg-[url(https://c.animaapp.com/mf0kcxh3ChSQMm/img/rectangle-152.svg)] bg-[100%_100%] overflow-x-hidden w-[667px] h-[458px] relative"
        role="main"
        aria-labelledby="task-title"
      >
        <header class="absolute w-[549px] h-6 top-[21px] left-[66px]">
          <div class="w-[551px] h-6">
            <div class="relative w-[549px] h-6">
              <h1
                id="task-title"
                class="absolute w-[510px] top-0 left-0 [font-family:'Inter',Helvetica] font-medium text-[#111111] text-xl tracking-[0] leading-[normal]"
              >
                Task
              </h1>
              <div class="absolute w-[53px] h-5 top-0.5 left-[496px]" role="toolbar" aria-label="Task actions">
                <img
                  class="w-[53px] h-5"
                  src="https://c.animaapp.com/mf0kcxh3ChSQMm/img/group-115.png"
                  alt="Task action buttons"
                />
              </div>
            </div>
          </div>
        </header>
        <hr
          class="absolute w-[667px] h-px top-[60px] left-0 object-cover border-0 bg-[url(https://c.animaapp.com/mf0kcxh3ChSQMm/img/vector-4.svg)]"
          aria-hidden="true"
        />
        <section class="absolute w-[529px] h-[287px] top-[98px] left-[66px]" aria-labelledby="task-details">
          <h2
            id="task-details"
            class="absolute w-[510px] top-0 left-0 [font-family:'Inter',Helvetica] font-semibold text-[#111111] text-[42px] tracking-[0] leading-[normal]"
          >
            Wordpress plugin update
          </h2>
          <div class="absolute top-[88px] left-[18px]">
            <div class="inline-flex items-center gap-4">
              <img
                class="relative w-[19px] h-[21px] mt-[-0.50px] mb-[-0.50px] ml-[-0.50px]"
                src="https://c.animaapp.com/mf0kcxh3ChSQMm/img/group.png"
                alt="Status icon"
                aria-hidden="true"
              />
              <span
                class="relative w-fit mt-[-0.50px] [font-family:'Inter',Helvetica] font-medium text-[#7d7d7d] text-base tracking-[0] leading-[normal] whitespace-nowrap"
                id="status-label"
              >
                Status
              </span>
            </div>
            <div
              class="flex w-[78px] h-6 items-center justify-center gap-2.5 px-[19px] py-1 ml-[190px] mt-[-2px] bg-[#e94949] rounded-[20px]"
              role="status"
              aria-labelledby="status-label"
            >
              <span
                class="relative w-fit mt-[-1.50px] [font-family:'Inter',Helvetica] font-medium text-white text-sm tracking-[0] leading-[normal]"
              >
                To do
              </span>
            </div>
          </div>
          <div class="absolute top-[133px] left-[18px]">
            <div class="inline-flex items-center gap-4">
              <img
                class="relative w-[18px] h-[18px]"
                src="https://c.animaapp.com/mf0kcxh3ChSQMm/img/vector-2.svg"
                alt="Project icon"
                aria-hidden="true"
              />
              <span
                class="relative w-fit mt-[-1.00px] [font-family:'Inter',Helvetica] font-medium text-[#7d7d7d] text-base tracking-[0] leading-[normal] whitespace-nowrap"
                id="project-label"
              >
                Project
              </span>
            </div>
            <div
              class="absolute w-[333px] h-[19px] top-0 left-[172px] [font-family:'Inter',Helvetica] font-semibold text-[#111111] text-base tracking-[0] leading-[normal]"

            >
              Website Management Company
            </div>
          </div>
          <div class="absolute top-[177px] left-[18px]">
            <div class="flex w-[104px] items-center gap-4">
              <img
                class="relative w-[18px] h-[18px]"
                src="https://c.animaapp.com/mf0kcxh3ChSQMm/img/vector-1.svg"
                alt="Timeline icon"
                aria-hidden="true"
              />
              <span
                class="relative w-fit mt-[-1.00px] [font-family:'Inter',Helvetica] font-medium text-[#7d7d7d] text-base tracking-[0] leading-[normal] whitespace-nowrap"
                id="timeline-label"
              >
                Timeline
              </span>
            </div>
            <time
              class="absolute w-[333px] h-[19px] top-0 left-[172px] [font-family:'Inter',Helvetica] font-semibold text-[#111111] text-base tracking-[0] leading-[normal]"
              datetime="2024-11-25/2024-11-30"
              aria-labelledby="timeline-label"
            >

            </time>
          </div>
          <div class="absolute top-[221px] left-[18px]">
            <div class="flex w-[104px] items-center gap-4">
              <img
                class="relative w-[18px] h-[14.86px]"
                src="https://c.animaapp.com/mf0kcxh3ChSQMm/img/group-1.png"
                alt="Assignee icon"
                aria-hidden="true"
              />
              <span
                class="relative w-fit mt-[-1.00px] mr-[-1.00px] [font-family:'Inter',Helvetica] font-medium text-[#7d7d7d] text-base tracking-[0] leading-[normal] whitespace-nowrap"
                id="assignee-label"
              >
                Assignee
              </span>
            </div>
            <div class="absolute top-[-5px] left-[172px]" aria-labelledby="assignee-label">
              <img
                class="w-7 h-[29px]"
                src="https://c.animaapp.com/mf0kcxh3ChSQMm/img/mask-group.png"
                alt="Assigned user avatar"
              />
            </div>
          </div>
          <div class="absolute top-[265px] left-[18px]">
            <div class="inline-flex items-center justify-center gap-4">
              <img
                class="relative w-[18px] h-[19.5px]"
                src="https://c.animaapp.com/mf0kcxh3ChSQMm/img/vector.svg"
                alt="Label icon"
                aria-hidden="true"
              />
              <span
                class="relative w-fit mt-[-0.75px] [font-family:'Inter',Helvetica] font-medium text-[#7d7d7d] text-base tracking-[0] leading-[normal] whitespace-nowrap"
                id="label-section"
              >
                Label
              </span>
            </div>
            <div
              class="inline-flex items-center justify-center gap-2.5 absolute top-[-2px] left-[172px]"
              role="group"
              aria-labelledby="label-section"
            >
              <span
                class="flex w-[78px] h-6 items-center justify-center gap-2.5 px-[19px] py-1 relative bg-[#ffb32d] rounded-[20px]"
                role="tag"
                aria-label="Priority: Medium"
              >
                <span
                  class="relative w-fit mt-[-1.50px] ml-[-7.00px] mr-[-7.00px] [font-family:'Inter',Helvetica] font-medium text-white text-sm tracking-[0] leading-[normal]"
                >
                  Medium
                </span>
              </span>
              <span
                class="flex w-[78px] h-6 items-center justify-center gap-2.5 px-[19px] py-1 relative bg-[#6fadc8] rounded-[20px]"
                role="tag"
                aria-label="Department: Engineer"
              >
                <span
                  class="relative w-fit mt-[-1.50px] ml-[-5.50px] mr-[-5.50px] [font-family:'Inter',Helvetica] font-medium text-white text-sm tracking-[0] leading-[normal]"
                >
                  Enginer
                </span>
              </span>
            </div>
          </div>
        </section>
      </article>

</html>
