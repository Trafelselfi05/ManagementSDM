<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@500;600&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9f9f9;
        }
        
        .sidebar-icon {
            @apply w-[35px] h-[35px] flex items-center justify-center;
        }
        
        .nav-button {
            @apply w-[162px] h-[46px] flex items-center justify-center rounded-[10px] text-xl font-medium;
        }
        
        .stat-card {
            @apply flex flex-col items-start gap-2.5 p-5 rounded-[20px] shadow-[0px_4px_4px_#00000040];
        }
    </style>
</head>
<body class="min-h-screen bg-gray-50">
    <!-- Layout Container -->
    <div class="flex flex-col min-h-screen">
        <!-- Header -->
        <header class="bg-white border-b border-gray-200 h-[147px] flex items-center px-8">
            <div class="flex items-center justify-between w-full">
                <!-- Logo -->
                <img class="w-[218px] h-[52px] object-cover" src="https://c.animaapp.com/mf52gmzudGNBVi/img/image-11.png" alt="Logo">
                
                <!-- Search Bar -->
                <div class="bg-white rounded-[38px] shadow-sm w-[740px] h-[65px] flex items-center px-6">
                    <div class="flex items-center justify-between w-full">
                        <span class="text-xl text-gray-500 font-medium">Search project</span>
                        <img class="w-[25px] h-[25px]" src="https://c.animaapp.com/mf52gmzudGNBVi/img/vector-2.svg" alt="Search icon">
                    </div>
                </div>
                
                <!-- User Profile -->
                <div class="flex items-center gap-4">
                    <div class="text-right">
                        <h2 class="text-2xl font-semibold text-gray-900">Freyaa</h2>
                        <p class="text-base text-gray-500">Admin</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <img class="w-[73px] h-[73px]" src="https://c.animaapp.com/mf52gmzudGNBVi/img/frame-38.svg" alt="Notification icon">
                        <img class="w-[73px] h-[73px]" src="https://c.animaapp.com/mf52gmzudGNBVi/img/frame-427322136.svg" alt="Profile icon">
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <div class="flex flex-1">
            <!-- Sidebar -->
            <aside class="w-[139px] bg-white border-r border-gray-200 flex flex-col items-center py-8">
                <div class="flex flex-col items-center gap-12">
                    <!-- Dashboard Icon -->
                    <div class="w-[65px] h-[65px] bg-[#f0f0f0] rounded-full flex items-center justify-center">
                        <img class="w-[35px] h-[35px]" src="https://c.animaapp.com/mf52gmzudGNBVi/img/bxs-dashboard.svg" alt="Dashboard">
                    </div>
                    
                    <!-- Tasks Icon -->
                    <div class="w-[65px] h-[65px] bg-[#f0f0f0] rounded-full flex items-center justify-center">
                        <img class="w-[23px] h-[29px]" src="https://c.animaapp.com/mf52gmzudGNBVi/img/vector-1.svg" alt="Tasks">
                    </div>
                    
                    <!-- Projects Icon -->
                    <div class="w-[65px] h-[65px] bg-[#f0f0f0] rounded-full flex items-center justify-center">
                        <img class="w-7 h-7" src="https://c.animaapp.com/mf52gmzudGNBVi/img/vector.svg" alt="Projects">
                    </div>
                    
                    <!-- Reports Icon -->
                    <div class="w-[65px] h-[65px] bg-[#f0f0f0] rounded-full flex items-center justify-center">
                        <img class="w-[35px] h-[35px]" src="https://c.animaapp.com/mf52gmzudGNBVi/img/tdesign-book-filled.svg" alt="Reports">
                    </div>
                    
                    <!-- Admin Icon -->
                    <div class="w-[65px] h-[65px] bg-[#f0f0f0] rounded-full flex items-center justify-center">
                        <img class="w-[35px] h-[35px]" src="https://c.animaapp.com/mf52gmzudGNBVi/img/eos-icons-admin.svg" alt="Admin">
                    </div>
                </div>
            </aside>

            <!-- Content Area -->
            <main class="flex-1 p-8">
                <div class="flex gap-8">
                    <!-- Left Panel - Task Status -->
                    <div class="bg-white rounded-[20px] shadow-sm w-[1000px] p-6">
                        <h2 class="text-2xl font-semibold text-gray-800 mb-6">Task Status</h2>
                        
                        <!-- Status Filters -->
                        <div class="flex justify-between mb-8">
                            <button class="nav-button bg-gray-900 text-white">Ready</button>
                            <button class="nav-button bg-white border border-gray-300 text-gray-900">Stand by</button>
                            <button class="nav-button bg-white border border-gray-300 text-gray-900">Not ready</button>
                            <button class="nav-button bg-white border border-gray-300 text-gray-900">Complete</button>
                            <button class="nav-button bg-white border border-gray-300 text-gray-900">Absent</button>
                        </div>
                        
                        <!-- Empty State -->
                        <div class="flex flex-col items-center justify-center h-[400px]">
                            <img class="w-8 h-10 mb-4" src="https://c.animaapp.com/mf52gmzudGNBVi/img/vector-4.svg" alt="No tasks">
                            <p class="text-xl font-semibold text-gray-900">No tasks ready</p>
                        </div>
                    </div>

                    <!-- Right Panel - Stats and Activity -->
                    <div class="flex flex-col gap-6 w-[676px]">
                        <!-- Tasks Card -->
                        <div class="stat-card bg-[#7db445] text-white h-[464px]">
                            <div class="flex items-center gap-2 mb-4">
                                <img src="https://c.animaapp.com/mf52gmzudGNBVi/img/ic-baseline-task.svg" alt="Tasks icon">
                                <h3 class="text-xl font-semibold">Tasks</h3>
                            </div>
                            <p class="text-xl font-semibold text-center mt-32">you have 0 tasks</p>
                        </div>

                        <!-- Projects Card -->
                        <div class="stat-card bg-[#ffb32d] text-white h-[464px]">
                            <div class="flex items-center gap-2 mb-4">
                                <img src="https://c.animaapp.com/mf52gmzudGNBVi/img/ant-design-project-filled.svg" alt="Projects icon">
                                <h3 class="text-xl font-semibold">Project</h3>
                            </div>
                            <p class="text-xl font-semibold text-center mt-32">There's no project</p>
                        </div>

                        <!-- Activity Card -->
                        <div class="stat-card bg-white h-[338px]">
                            <div class="flex items-center gap-2 mb-6">
                                <img src="https://c.animaapp.com/mf52gmzudGNBVi/img/mynaui-activity-square-solid.svg" alt="Activity icon">
                                <h3 class="text-[28px] font-semibold text-gray-500">Activity</h3>
                            </div>
                            
                            <!-- Activity Chart -->
                            <div class="w-full h-[255px] bg-white overflow-x-auto">
                                <div class="min-w-[1400px] relative">
                                    <!-- Horizontal line -->
                                    <div class="absolute top-1/2 w-full h-px bg-gray-300"></div>
                                    
                                    <!-- Month labels -->
                                    <div class="absolute bottom-0 flex w-full justify-between">
                                        <span class="text-[22px] font-semibold text-gray-500">Jan</span>
                                        <span class="text-[22px] font-semibold text-gray-500">Feb</span>
                                        <span class="text-[22px] font-semibold text-gray-500">Mar</span>
                                        <span class="text-[22px] font-semibold text-gray-500">Apr</span>
                                        <span class="text-[22px] font-semibold text-gray-500">May</span>
                                        <span class="text-[22px] font-semibold text-gray-500">Jun</span>
                                        <span class="text-[22px] font-semibold text-gray-500">Jul</span>
                                        <span class="text-[22px] font-semibold text-gray-500">Aug</span>
                                        <span class="text-[22px] font-semibold text-gray-500">Sep</span>
                                        <span class="text-[22px] font-semibold text-gray-500">Oct</span>
                                        <span class="text-[22px] font-semibold text-gray-500">Nov</span>
                                        <span class="text-[22px] font-semibold text-gray-500">Dec</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
