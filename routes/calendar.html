<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Custom Calendar Input - Tailwind</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Menghapus border pada select */
    select.border-none {
      border: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
    }
    select.border-none:focus {
      outline: none;
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-lg bg-white rounded-2xl shadow-lg p-6">
    <!-- Header: nama bulan 3 huruf + tahun, dropdown, prev, next -->
    <div class="flex items-center gap-3 mb-4">
      <!-- Nama bulan 3 huruf + tahun -->
      <div id="month-short" class="text-xl font-semibold w-28 text-center">Apr</div>

      <!-- Dropdown pilih bulan + tahun -->
      <div class="flex-1 flex gap-2">
        <select id="year-select" class="w-28 p-2 border-none rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"></select>
      </div>

      <!-- Geser kiri -->
      <button id="prev-btn" aria-label="Previous month" class="p-2 rounded-lg hover:bg-gray-100">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
        </svg>
      </button>

      <!-- Geser kanan -->
      <button id="next-btn" aria-label="Next month" class="p-2 rounded-lg hover:bg-gray-100">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
        </svg>
      </button>
    </div>

    <!-- Weekdays header -->
    <div class="grid grid-cols-7 text-center text-sm font-medium text-gray-600 mb-2">
      <div>S</div>
      <div>M</div>
      <div>T</div>
      <div>W</div>
      <div>T</div>
      <div>F</div>
      <div>S</div>
    </div>

    <!-- Calendar grid -->
    <div id="dates-grid" class="grid grid-cols-7 gap-2">
      <!-- date cells generated by JS -->
    </div>
  </div>

  <script>
    const monthShort = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const monthFull = ['January','February','March','April','May','June','July','August','September','October','November','December'];

    let viewDate = new Date();

    const monthShortEl = document.getElementById('month-short');
    const yearSelect = document.getElementById('year-select');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const datesGrid = document.getElementById('dates-grid');

    function initDropdowns() {
      // Inisialisasi dropdown tahun
      yearSelect.innerHTML = '';
      const currentYear = new Date().getFullYear();
      for (let y = currentYear - 50; y <= currentYear + 50; y++) {
        const opt = document.createElement('option');
        opt.value = y;
        opt.textContent = y;
        yearSelect.appendChild(opt);
      }
      
      updateDropdowns();
    }

    function updateDropdowns() {
      yearSelect.value = viewDate.getFullYear();
    }

    function render() {
      const year = viewDate.getFullYear();
      const month = viewDate.getMonth();

      // Tampilkan hanya 3 huruf untuk bulan
      monthShortEl.textContent = monthShort[month];

      updateDropdowns();

      datesGrid.innerHTML = '';

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      // Hari dari bulan sebelumnya (kosong)
      for (let i = 0; i < firstDay; i++) {
        const cell = document.createElement('div');
        cell.className = 'w-10 h-10 rounded-full text-center text-sm text-gray-400';
        datesGrid.appendChild(cell);
      }

      // Hari dalam bulan ini
      for (let d = 1; d <= daysInMonth; d++) {
        const cell = document.createElement('button');
        cell.type = 'button';
        cell.className = 'w-10 h-10 rounded-full text-center text-sm flex items-center justify-center focus:outline-none hover:bg-gray-200';
        cell.textContent = d;

        const today = new Date();
        if (d === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
          cell.classList.add('bg-blue-500', 'text-white', 'font-semibold');
        }

        cell.addEventListener('click', () => {
          const prev = datesGrid.querySelector('.selected');
          if (prev) prev.classList.remove('selected', 'bg-blue-500', 'text-white');

          cell.classList.add('selected', 'bg-blue-500', 'text-white');
          const ev = new CustomEvent('date-selected', { detail: new Date(year, month, d) });
          document.dispatchEvent(ev);
        });

        datesGrid.appendChild(cell);
      }
    }

    prevBtn.addEventListener('click', () => {
      viewDate.setMonth(viewDate.getMonth() - 1);
      render();
    });

    nextBtn.addEventListener('click', () => {
      viewDate.setMonth(viewDate.getMonth() + 1);
      render();
    });

    yearSelect.addEventListener('change', (e) => {
      viewDate.setFullYear(Number(e.target.value));
      render();
    });

    document.addEventListener('date-selected', (e) => {
      console.log('Selected date:', e.detail.toISOString().slice(0,10));
    });

    initDropdowns();
    render();
  </script>
</body>
</html>
